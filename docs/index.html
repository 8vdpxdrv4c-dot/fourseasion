<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d20" />
    <meta name="description" content="一座漂在星海里的四季转盘。金针扫过的地方，土地跟着换季。" />
    <title>你愿意陪我走遍四季吗</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23070d20' stroke='%23d8b66d' stroke-width='2'/%3E%3Cpath d='M16 6 L17.2 16 L16 14.2 L14.8 16 Z' fill='%23d8b66d'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/fourseasion/assets/index-Uo5-aZEI.js"></script>
    <link rel="stylesheet" crossorigin href="/fourseasion/assets/index-C7Y6UIuw.css">
  </head>
  <body>
    <div id="stage">
      <header class="top" id="top">
        <p class="kicker">四季</p>
        <h1>你愿意陪我走遍四季吗？</h1>
        <p class="now" id="now">春 · 桃花酿暖</p>
      </header>
      <p class="sr-only" id="live" aria-live="polite"></p>
      <footer class="dock" id="dock">
        <div class="bar">
          <div class="seasons" role="group" aria-label="选择季节">
            <button type="button" data-season="0" aria-label="切换到春季">春</button>
            <button type="button" data-season="1" aria-label="切换到夏季">夏</button>
            <button type="button" data-season="2" aria-label="切换到秋季">秋</button>
            <button type="button" data-season="3" aria-label="切换到冬季">冬</button>
          </div>
          <div class="transport">
            <button type="button" id="play" aria-label="暂停轮转" aria-pressed="true">暂停</button>
            <label class="speed">
              <span>速度</span>
              <input id="speed" type="range" min="0.25" max="5" step="0.05" value="1" aria-label="轮转速度" aria-valuemin="0.25" aria-valuemax="5" aria-valuenow="1" aria-valuetext="1.0倍" />
              <span id="speed-readout">1.0×</span>
            </label>
            <button type="button" id="full" aria-label="全屏">全屏</button>
          </div>
        </div>
        <p class="hint">拖拽旋转，滚轮缩放</p>
      </footer>
      <div class="vignette" aria-hidden="true"></div>
      <div id="fallback" hidden>
        <div>
          <p class="fallback-title">星空还没亮</p>
          <p id="fallback-copy"></p>
        </div>
      </div>
    </div>
  </body>
</html>
